[pytest]
base_url = https://aqxtrader.aquariux.com
bdd_features_base_dir = features/
testpaths = tests
pythonpath = .
# Every run records Allure results (the last run's only). Build the HTML report from them:
# npx allure@3.20.1 generate allure-results  (settings in allurerc.json)
addopts = --alluredir=allure-results --clean-alluredir
markers =
    login: login page scenarios (features/login.feature)
    trading: places orders on the shared demo account, so these run one at a time (docs/conventions.md)
    market_order: market orders with Stop Loss and Take Profit (features/market_order.feature)
    one_click: market orders with one-click trading (features/one_click_trading.feature)
    pending_order: placing, changing and deleting pending orders (features/pending_order.feature)
    open_positions: viewing, changing and closing open positions (features/open_positions.feature)
    bulk_actions: bulk close and bulk delete (features/bulk_actions.feature)
    trading_history: notifications, Positions History, Orders & Deals (features/trading_history.feature)
    trade_records: one trade's details and status across every record (features/trade_records.feature)
    market_closed: what a trader sees and gets while a symbol's market is closed (features/market_closed.feature)
    smoke: one quick scenario per feature, its main flow; run by the GitHub workflow (.github/workflows/smoke.yml)
    defect: a site defect (docs/defects.md); the scenario checks the right behaviour, so it runs as a strict xfail until it's fixed
